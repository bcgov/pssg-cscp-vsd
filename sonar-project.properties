# SonarCloud configuration for PSSG-CSCP-VSD
# BC Government Crime Victim Assistance Program

# Project identification
sonar.projectKey=bcgov_pssg-cscp-vsd
sonar.organization=bcgov-sonarcloud
sonar.projectName=Coast VSD
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/wwwroot/lib/**,**/ClientApp/dist/**,**/ClientApp/e2e/**,**/ClientApp/coverage/**,**/*.min.js,**/*.min.css,**/migrations/**,**/Migrations/**

# Test configuration
sonar.tests=Tests,vsd-app/ClientApp/src
sonar.test.inclusions=**/*Tests.cs,**/src/**/*.spec.ts,**/src/**/*.test.ts
sonar.test.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/coverage/**,**/e2e/**

# C# specific exclusions
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs,**/GlobalUsings.cs,Database/Model/Entities/**,Database/Model/Messages/**,Database/Model/OptionSets/**,vsd-interfaces/Dynamics-Autorest/Models/**,**/ServiceCollectionExtensions.cs

# JavaScript/TypeScript exclusions for generated and vendor files
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js
sonar.typescript.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/*.d.ts

# Duplicate detection
sonar.cpd.exclusions=Database/Model/**,vsd-interfaces/Dynamics-Autorest/Models/**