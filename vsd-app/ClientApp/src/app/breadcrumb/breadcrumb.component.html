@if (visible) {
  <div class="container breadcrumb-outer">
    <ol class="breadcrumb">
      <li><a routerLink="/">Home</a></li>
      @for (breadcrumb of breadcrumbs; track breadcrumb) {
        <li>
          <a [routerLink]="[breadcrumb.url]">{{ breadcrumb.label }}</a>
        </li>
      }
    </ol>
  </div>
}
