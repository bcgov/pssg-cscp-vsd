# .github/dependabot.yml — version updates: actions + npm + nuget + docker.
# Small (patch/minor) updates ONLY — majors are ignored everywhere, so big jumps
# (Angular/.NET/Node/Caddy majors) arrive as security ALERTS to plan, never as
# surprise PRs. One grouped PR per ecosystem, monthly, assigned for notification.
# CVE security-update PRs come from the repo security toggles and respect the
# same ignore-majors rules. Docker block keeps the digest-pinned FROMs fresh.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees: ["rohithvarmayadla"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /vsd-app/ClientApp
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-safe:
        patterns: ["*"]

  # Glob so the shared projects (Database, Shared.Database, ...) are covered too
  - package-ecosystem: nuget
    directories: ["/**/*"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-safe:
        patterns: ["*"]

  # Active CD-built Dockerfiles only (openshift/ubi8 file is dead)
  - package-ecosystem: docker
    directories: ["/vsd-app", "/vsd-app/ClientApp"]
    schedule:
      interval: monthly
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
