name: Promote VSD to PROD

# [1] MANUAL ONLY — a human picks the source (a TAG) and which images move
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source tag: test (ship what test proved) · sha-<commit> · prod-backup (= ROLLBACK)"
        default: "test"
      images:
        description: "Which image(s) move — dropdown: no typing, no typos"
        type: choice
        options:
          - all
          - vsd-api
          - vsd-ui
        default: all

# [2] GUARD RAIL · MINIMAL PERMISSIONS — GitHub token reads only; the cluster is reached via secrets
permissions:
  contents: read

# [3] GUARD RAIL · ONE PROMOTION AT A TIME — runs QUEUE; a mid-move promotion is never cancelled
concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod          # [4] prod's Environment requires a reviewer once one is bound — the run PAUSES for approval

    steps:
      - uses: redhat-actions/openshift-tools-installer@v2   # third-party — pin to commit SHA when hardening
        with:
          oc: "4"
      - run: oc login --token=${{ secrets.OCP4_PASSWORD }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: "PASS 1 — resolve every digest first · PASS 2 — move tags. Half-promotion is impossible."
        run: |
          LIST="${{ inputs.images }}"
          [ "$LIST" = "all" ] && LIST="vsd-api vsd-ui"
          NS=${{ secrets.OCP4_NAMESPACE }}
          declare -A DIGEST
          for img in $LIST; do
            DIGEST[$img]=$(oc get istag $img:${{ inputs.source_tag }} -n $NS -o jsonpath='{.image.metadata.name}')
            if [ -z "${DIGEST[$img]}" ]; then
              echo "::error::could not resolve $img:${{ inputs.source_tag }} in $NS — nothing moved"; exit 1
            fi
          done
          for img in $LIST; do
            oc tag $NS/$img:prod $NS/$img:prod-backup --reference-policy=local || true
            oc tag $NS/$img@${DIGEST[$img]} $NS/$img:prod --reference-policy=local
          done

      - name: "VERIFY — done when pods are Ready, not when the tag moves"
        run: |
          LIST="${{ inputs.images }}"
          [ "$LIST" = "all" ] && LIST="vsd-api vsd-ui"
          oc project f9a9e6-prod
          for img in $LIST; do
            oc rollout status deployment/$img-argo --timeout=300s   # vsd-api-argo / vsd-ui-argo
          done
          # VERIFY = rollout status only: the pipeline SA has 'view' (not exec), and the runner is off-network.
