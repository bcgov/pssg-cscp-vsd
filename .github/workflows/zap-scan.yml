name: ZAP Full Scan - Internal

on:
  workflow_dispatch:

jobs:
  zap-full-scan:
    name: ZAP Full UI & API Scan
    runs-on: self-hosted

    strategy:
      matrix:
        include:
          - name: vsd-ui
            url: https://coast-vsd-dev.silver.devops.bcgov

    steps:
      - name: Wait for ZAP API to be ready
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s http://zap-scanner:8080/JSON/core/view/version/ | jq -r .version || echo "notready")
            if [[ "$STATUS" != "notready" ]]; then
              echo "ZAP Ready - Version: $STATUS"
              break
            fi
            echo "Waiting for ZAP API..."
            sleep 5
          done

      - name: Spider target
        run: |
          echo "Starting Spider on ${{ matrix.url }}"
          curl -k "http://zap-scanner:8080/JSON/spider/action/scan/?url=${{ matrix.url }}&recurse=true"
          sleep 20

      - name: Start Active Scan
        run: |
          echo "Starting Active Scan on ${{ matrix.url }}"
          curl -k "http://zap-scanner:8080/JSON/ascan/action/scan/?url=${{ matrix.url }}&recurse=true"
          sleep 20
          # Optionally wait until scan completes (advanced)

      - name: Fetch ZAP JSON Report
        run: |
          curl -k "http://zap-scanner:8080/OTHER/core/other/jsonreport/" -o zap-${{ matrix.name }}.json



