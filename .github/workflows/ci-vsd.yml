name: CI VSD

# [1] WHEN IT RUNS — PRs, merges, a twice-monthly re-scan, and a manual button.
on:
  pull_request:
    branches: [development]
    paths:
      - "vsd-app/**"
      - "Database/**"
      - "Shared.Database/**"
  push:
    branches: [development]
    paths:
      - "vsd-app/**"
      - "Database/**"
      - "Shared.Database/**"
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code, write scan reports, nothing else
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE RUN AT A TIME — a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — 'gate' is the exact check name branch protection requires green
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # [5] SETUP -> UI half (build) -> API half (compile) -> whole codebase (CodeQL)
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript-typescript
          queries: security-extended

      # ── UI HALF: build the Angular SPA (served by Caddy) ──
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: vsd-app/ClientApp/package-lock.json
      - working-directory: vsd-app/ClientApp
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build

      # ── API HALF: compile the .NET app (no CSharpier gate on vsd) ──
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build vsd-app/vsd-app.csproj -c Release

      # ── WHOLE CODEBASE: CodeQL writes its report — C# + TypeScript, one run ──
      - uses: github/codeql-action/analyze@v3
