name: CD VSD API

# [1] WHEN IT RUNS — a merge touching the API's folders (its reference graph, minus the UI), or manual.
on:
  push:
    branches: [development]
    paths:
      - "vsd-app/**"
      - "!vsd-app/ClientApp/**"
      - "Database/**"
      - "Shared.Database/**"
      - ".dockerignore"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code + write scan reports; registry access = repo secrets only
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE BUILD PER IMAGE AT A TIME — a newer merge cancels the stale build
concurrency:
  group: cd-vsd-api-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — hard 30-minute cap
jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # [5] fetch -> registry login -> names+labels -> build+push -> scan -> report
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCP4_REGISTRY }}
          username: unused
          password: ${{ secrets.OCP4_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/vsd-api
          tags: |
            type=raw,value=latest
            type=raw,value=development
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vsd-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_IMAGE_NAME=vsd-api
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max                    # SLSA provenance
          sbom: true                              # SPDX SBOM
      - uses: aquasecurity/trivy-action@v0.35.0    # third-party — pin to commit SHA when hardening
        with:
          image-ref: ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/vsd-api:latest
          format: sarif
          output: trivy-vsd-api.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-vsd-api.sarif
          category: trivy-vsd-api
