name: ZAP coast vsd dev Scan

on:
  workflow_dispatch:

jobs:
  zap-coast-vsd-dev-full-scan:
    name: ZAP coast vsd dev Full Scan
    runs-on: [self-hosted, linux]
    timeout-minutes: 45

    env:
      ZAP_API: http://zaproxy:8080
      ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
      ZAP_TARGET: https://coast-vsd-dev.silver.devops.bcgov

    steps:
      - name: Wait for ZAP to be ready
        run: |
          set -e
          for i in {1..30}; do
            if curl -sk "${ZAP_API}/JSON/core/view/version/?apikey=${ZAP_API_KEY}" | grep version; then
              echo "ZAP is ready!"
              exit 0
            fi
            echo "Waiting for ZAP..."
            sleep 10
          done
          echo "ZAP did not become ready in time"
          exit 1

      - name: Prime ZAP site tree with all important UI and API paths
        env:
          PROXY: http://zaproxy:8080
        run: |
          # Prime UI paths
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/victim-application&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/ifm-application&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/witness-application&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/submit-invoice&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/application-cancelled&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/application-success&followRedirects=true"
          curl -sk "${ZAP_API}/JSON/core/action/accessUrl/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}/some-random-not-found-path&followRedirects=true"

          # Prime API endpoints
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/cvap-emails"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/countries"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/provinces"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/cities"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/cities/search?country=CA&province=BC&searchVal=test&limit=10"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/country/CA/cities"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/country/1/province/1/cities"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/relationships"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/auth_relationships"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/representative_relationships"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/imf_representative_relationships"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/restitution_relationships"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/police_detachments"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/lookup/courts"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/configuration"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/justice/validate_vendor/12345/ABC123"
          curl -x $PROXY -sk "${ZAP_TARGET}/api/justice/validate_vendor_and_counsellor/12345/ABC123/67890/Smith"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/aem/victim"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/aem/ifm"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/aem/witness"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/aem/authorization"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/aem/invoice"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/payment/send"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/paymentschedule/schedule-cvap"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/justice/saveapplication"
          curl -x $PROXY -sk -H "Content-Type: application/json" -d '{}' "${ZAP_TARGET}/api/justice/submitcounsellorinvoice"

      - name: Start classic spider scan (broad crawl)
        run: |
          set -e
          SPIDER_ID=$(curl -sk "${ZAP_API}/JSON/spider/action/scan/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}" | jq -r .scan)
          echo "Spider scan started: $SPIDER_ID"
          if [ "$SPIDER_ID" = "null" ] || [ -z "$SPIDER_ID" ]; then
            echo "Spider scan failed to start (ID is null or empty)."
            exit 1
          fi
          for i in {1..90}; do
            STATUS=$(curl -sk "${ZAP_API}/JSON/spider/view/status/?apikey=${ZAP_API_KEY}&scanId=$SPIDER_ID" | jq -r .status)
            echo "Spider progress: $STATUS%"
            if [ "$STATUS" = "100" ]; then
              echo "Spider scan completed"
              break
            fi
            sleep 5
          done

      - name: Start AJAX spider scan (for JS-heavy/SPAs)
        run: |
          set -e
          AJAX_SCAN_ID=$(curl -sk "${ZAP_API}/JSON/ajaxSpider/action/scan/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}" | jq -r .scan)
          echo "AJAX spider scan started: $AJAX_SCAN_ID"
          # Poll for AJAX spider completion
          for i in {1..60}; do
            STATUS=$(curl -sk "${ZAP_API}/JSON/ajaxSpider/view/status/?apikey=${ZAP_API_KEY}" | jq -r .status)
            echo "AJAX spider progress: $STATUS"
            if [ "$STATUS" = "stopped" ]; then
              echo "AJAX spider scan completed"
              break
            fi
            sleep 5
          done

      - name: Start active scan (full site)
        run: |
          set -e
          SCAN_ID=$(curl -sk "${ZAP_API}/JSON/ascan/action/scan/?apikey=${ZAP_API_KEY}&url=${ZAP_TARGET}" | jq -r .scan)
          echo "Active scan started: $SCAN_ID"
          if [ "$SCAN_ID" = "null" ] || [ -z "$SCAN_ID" ]; then
            echo "Active scan failed to start (ID is null or empty)."
            exit 1
          fi
          for i in {1..120}; do
            STATUS=$(curl -sk "${ZAP_API}/JSON/ascan/view/status/?apikey=${ZAP_API_KEY}&scanId=$SCAN_ID" | jq -r .status)
            echo "Active scan progress: $STATUS%"
            if [ "$STATUS" = "100" ]; then
              echo "Active scan completed"
              break
            fi
            sleep 10
          done

      - name: Download ZAP scan report
        run: |
          set -e
          curl -sk "${ZAP_API}/OTHER/core/other/jsonreport/?apikey=${ZAP_API_KEY}" -o zap_coast_vsd_dev_report.json
          if [ ! -s zap_coast_vsd_dev_report.json ]; then
            echo "Download failed or zap_coast_vsd_dev_report.json is empty!"
            exit 1
          fi
          ls -lh zap_coast_vsd_dev_report.json
          head zap_coast_vsd_dev_report.json

      - name: Upload ZAP full scan report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-coast-vsd-dev-report
          path: zap_coast_vsd_dev_report.json